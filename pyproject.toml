[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-grader"
version = "0.1.0"
description = "Modular AI grading agent for engineering programming projects"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "openai",
    "pypdf>=5.0",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]
