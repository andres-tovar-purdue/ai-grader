name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AI Grader
        run: python -m pip install -e .

      # The suite mocks OpenAI, so no API key or secrets are needed.
      - name: Run tests
        run: python -m unittest discover -s tests -v
